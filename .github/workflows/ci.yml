name: CI

on:
  pull_request:
    branches:
      - main
      - "spec/*"
      - "impl/*"
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint, Type Check, Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Format Check
        run: pnpm format:check

      - name: Type Check
        run: pnpm type-check

      - name: Build
        run: pnpm build

      - name: Test with Coverage
        run: pnpm test:coverage

      - name: Upload Coverage Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: packages/poc/coverage/
          retention-days: 7

      - name: Coverage Summary
        if: always()
        run: |
          if [ -f packages/poc/coverage/coverage-summary.json ]; then
            echo "## Test Coverage Summary" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo '```json' >> $GITHUB_STEP_SUMMARY
            cat packages/poc/coverage/coverage-summary.json >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: ci

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Browsers
        run: pnpm --filter web exec playwright install --with-deps chromium

      # Build不要（リモートURL対向のため）

      # --- プレビューURL取得（PR時のみ） ---
      - name: Get Vercel Preview URL
        if: github.event_name == 'pull_request'
        uses: zentered/vercel-preview-url@v1.1.9
        id: vercel_preview_url
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        with:
          vercel_project_id: ${{ secrets.VERCEL_PROJECT_ID }}
        continue-on-error: true

      - name: Wait for Preview Deployment
        if: github.event_name == 'pull_request' && steps.vercel_preview_url.outcome == 'success'
        id: wait_preview
        run: |
          PREVIEW_URL="https://${{ steps.vercel_preview_url.outputs.preview_url }}"
          echo "Waiting for $PREVIEW_URL to be ready..."
          for i in $(seq 1 30); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$PREVIEW_URL" || true)
            if [ "$STATUS" = "200" ]; then
              echo "Preview is ready!"
              echo "ready=true" >> $GITHUB_OUTPUT
              exit 0
            fi
            echo "Attempt $i: status=$STATUS, waiting 10s..."
            sleep 10
          done
          echo "Preview URL not ready after 5 minutes"
          echo "ready=false" >> $GITHUB_OUTPUT
        continue-on-error: true

      # --- E2E対象URL決定 ---
      - name: Set E2E Target URL
        id: e2e_target
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "url=${{ secrets.PRODUCTION_URL }}" >> $GITHUB_OUTPUT
            echo "skip=false" >> $GITHUB_OUTPUT
            echo "Using production URL"
          elif [ "${{ steps.vercel_preview_url.outcome }}" = "success" ] && \
               [ "${{ steps.wait_preview.outputs.ready }}" = "true" ]; then
            echo "url=https://${{ steps.vercel_preview_url.outputs.preview_url }}" >> $GITHUB_OUTPUT
            echo "skip=false" >> $GITHUB_OUTPUT
            echo "Using Vercel preview URL"
          else
            echo "url=" >> $GITHUB_OUTPUT
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "Skipping E2E: no remote URL available"
          fi

      # --- E2E実行（リモートURLが取得できた場合のみ） ---
      # E2E setup helper (apps/web/e2e/lib/api-setup.ts) は PLAYWRIGHT_API_URL が
      # 未指定の場合 ${PLAYWRIGHT_BASE_URL}/api にフォールバックする。
      # PR(preview)/push(prod) いずれでもテスト対象URLと同じホストの API を叩くため、
      # ここでは PLAYWRIGHT_API_URL を明示しない（preview の /api を確実に使うため）。
      - name: Run Critical E2E Tests
        if: steps.e2e_target.outputs.skip != 'true'
        run: pnpm --filter web test:e2e --grep @critical --reporter=list,blob
        env:
          PLAYWRIGHT_BASE_URL: ${{ steps.e2e_target.outputs.url }}
          PLAYWRIGHT_BLOB_OUTPUT_DIR: blob-report

      - name: Run Non-Critical E2E Tests
        if: steps.e2e_target.outputs.skip != 'true'
        run: pnpm --filter web test:e2e --grep-invert @critical --reporter=list,blob
        continue-on-error: true
        env:
          PLAYWRIGHT_BASE_URL: ${{ steps.e2e_target.outputs.url }}
          PLAYWRIGHT_BLOB_OUTPUT_DIR: blob-report

      - name: Merge E2E Reports
        if: always() && steps.e2e_target.outputs.skip != 'true'
        run: |
          if find apps/web/blob-report -name '*.zip' 2>/dev/null | grep -q .; then
            pnpm --filter web exec playwright merge-reports --reporter=html ./blob-report
          else
            echo "::warning::No blob report files found, skipping merge"
          fi

      - name: Upload Playwright Report
        uses: actions/upload-artifact@v4
        if: always() && steps.e2e_target.outputs.skip != 'true'
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7
          if-no-files-found: warn

      - name: Upload Test Results (Traces)
        uses: actions/upload-artifact@v4
        if: always() && steps.e2e_target.outputs.skip != 'true'
        with:
          name: playwright-test-results
          path: apps/web/e2e/test-results/
          retention-days: 7
          if-no-files-found: warn

      - name: E2E Skipped Notice
        if: steps.e2e_target.outputs.skip == 'true'
        run: |
          echo "::notice title=E2E Tests Skipped::Vercel preview URL not available. E2E tests will run after merge to main."

  deploy-pages:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: e2e
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: "pages"
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          sparse-checkout: mockups

      - name: Download Playwright Report
        uses: actions/download-artifact@v4
        with:
          name: playwright-report
          path: _site/e2e-report
        continue-on-error: true

      - name: Assemble Site
        run: |
          mkdir -p _site/mockups
          cp -r mockups/* _site/mockups/

          if [ -d "_site/e2e-report" ] && [ -f "_site/e2e-report/index.html" ]; then
            E2E_STATUS="available"
          else
            E2E_STATUS="unavailable"
          fi

          DEPLOY_TIME=$(date -u '+%Y-%m-%d %H:%M UTC')

          cat > _site/index.html <<'HTMLEOF'
          <!DOCTYPE html>
          <html lang="ja">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>SCP Recommend - Project Pages</title>
            <script src="https://cdn.tailwindcss.com"></script>
          </head>
          <body class="bg-neutral-100 text-neutral-800 min-h-screen p-6">
            <h1 class="text-2xl font-bold mb-2">SCP Recommend - Project Pages</h1>
            <p id="deploy-time" class="text-sm text-neutral-500 mb-6"></p>
            <div class="grid gap-4 max-w-xl">
              <a href="./mockups/" class="block p-6 bg-white rounded-lg shadow-sm border-l-4 border-blue-500 hover:shadow-md transition-shadow">
                <div class="font-medium text-lg">Mockups</div>
                <div class="text-sm text-neutral-500 mt-2">UI design mockups and color comparisons</div>
              </a>
              <div id="e2e-link"></div>
            </div>
            <script>
              document.getElementById('deploy-time').textContent = 'Last deployed: __DEPLOY_TIME__';
              var status = '__E2E_STATUS__';
              var container = document.getElementById('e2e-link');
              if (status === 'available') {
                container.innerHTML = '<a href="./e2e-report/" class="block p-6 bg-white rounded-lg shadow-sm border-l-4 border-green-500 hover:shadow-md transition-shadow"><div class="font-medium text-lg">E2E Test Report</div><div class="text-sm text-neutral-500 mt-2">Playwright HTML report (latest main branch run)</div></a>';
              } else {
                container.innerHTML = '<div class="block p-6 bg-neutral-50 rounded-lg shadow-sm border-l-4 border-neutral-300"><div class="font-medium text-lg text-neutral-400">E2E Test Report</div><div class="text-sm text-neutral-400 mt-2">No report available (e2e tests were skipped or failed)</div></div>';
              }
            </script>
          </body>
          </html>
          HTMLEOF

          sed -i "s|__DEPLOY_TIME__|${DEPLOY_TIME}|g" _site/index.html
          sed -i "s|__E2E_STATUS__|${E2E_STATUS}|g" _site/index.html

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
