<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>案B: 機密文書風 - SCP Recommend</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* 案B: 「機密文書」風 */
    :root {
      --bg: #F8F6F1;
      --card: #FFFFFF;
      --text: #2C2C2C;
      --text-muted: #71717A;
      --primary: #1C1C1C;
      --accent: #C9B037;
      --border: #D4D4D4;
      --stamp: #8B0000;
    }

    body {
      background: var(--bg);
      color: var(--text);
      overflow: hidden;
    }

    .typewriter {
      font-family: 'Courier New', Courier, monospace;
    }

    .stamp {
      border: 3px solid var(--stamp);
      color: var(--stamp);
      transform: rotate(-5deg);
      font-weight: bold;
    }
  </style>
</head>
<body class="h-screen flex flex-col">

  <!-- ヘッダー -->
  <header class="flex-shrink-0 border-b" style="background: var(--bg); border-color: var(--border);">
    <div class="flex items-center justify-between px-4 py-3">
      <h1 class="text-lg font-bold typewriter" style="color: var(--primary);">SCP-5000</h1>
      <button class="flex items-center gap-1 text-sm" style="color: var(--text-muted);">
        <span>次へ</span>
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
        </svg>
      </button>
    </div>
    <div class="h-1" style="background: var(--accent);"></div>
  </header>

  <!-- iframe -->
  <main class="flex-1">
    <iframe
      src="https://scp-jp.wikidot.com/scp-5000"
      class="w-full h-full border-0"
    ></iframe>
  </main>

  <!-- お気に入りボタン -->
  <button
    class="fixed bottom-6 right-6 z-50 w-14 h-14 rounded-full flex items-center justify-center shadow-lg"
    style="background: var(--primary);"
  >
    <svg class="w-7 h-7 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"/>
    </svg>
  </button>

  <!-- 案ラベル -->
  <div class="fixed top-16 left-4 stamp px-3 py-1 rounded text-xs z-50">
    案B: 機密文書風
  </div>

</body>
</html>
