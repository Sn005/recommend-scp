# lefthook設定 - コミットフック
# https://lefthook.dev/configuration/

pre-commit:
  parallel: true
  commands:
    lint:
      glob: "**/*.{ts,tsx,js,jsx,mjs}"
      run: pnpm eslint --fix {staged_files}
      stage_fixed: true
    format:
      glob: "**/*.{ts,tsx,js,jsx,mjs,json,md,yml,yaml}"
      run: pnpm prettier --write {staged_files}
      stage_fixed: true

commit-msg:
  commands:
    commitlint:
      run: pnpm commitlint --edit {1}

# プッシュ前に全体チェック（CIエラー防止）
pre-push:
  parallel: true
  commands:
    format-check:
      run: pnpm format:check
    lint-check:
      run: pnpm lint
    type-check:
      run: pnpm type-check
